name: Rozpoznanie licytacji (tymczasowe)

on:
  push:
    branches: [claude/new-session-tbgro0]
    paths: [tools/probe_auctions.py, .github/workflows/rozpoznanie.yml]

permissions:
  contents: write

jobs:
  rozpoznanie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - run: python tools/probe_auctions.py
      - name: Zapisz pliki do gałęzi
        run: |
          git config user.name "rozpoznanie"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_probe
          git commit -m "Tymczasowe pliki rozpoznania licytacji [skip ci]" || true
          git push
