name: Monitor ogłoszeń

on:
  schedule:
    - cron: "17 */2 * * *"   # co 2 godziny (czas UTC)
  workflow_dispatch:          # przycisk "Run workflow" do ręcznego uruchomienia

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sprawdź ogłoszenia
        run: python monitor.py
        env:
          # Sekrety ustawiane w Settings > Secrets and variables > Actions (instrukcja w README).
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

      - name: Zapisz wyniki
        run: |
          git config user.name "monitor-ogloszen"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "Aktualizacja ofert $(date -u '+%Y-%m-%d %H:%M')"
          git push
